<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>請求・見積アプリ UIモック（例示データ）</title>
<style>
  @font-face {
    font-family: "InvoiceUI";
    font-style: normal;
    font-weight: 400;
    src: local("Noto Sans CJK JP"), local("Noto Sans CJK JP Regular");
  }
  @font-face {
    font-family: "InvoiceUI";
    font-style: normal;
    font-weight: 700;
    src: local("Noto Sans CJK JP"), local("Noto Sans CJK JP Bold");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #d4cdc2;
    color: #1c1915;
    font-family: "InvoiceUI", "Noto Sans CJK JP", sans-serif;
    font-weight: 400;
  }
  .wrap { padding: 28px 28px 48px; }
  .intro { max-width: 760px; margin: 0 0 8px; }
  .intro h1 { font-size: 22px; line-height: 1.4; margin: 0 0 8px; font-weight: 700; }
  .intro p { margin: 0 0 6px; font-size: 14px; line-height: 1.6; }
  .gallery { display: flex; flex-wrap: wrap; gap: 28px 22px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 13px; font-weight: 700; margin: 0 0 8px; }

  .phone {
    --paper: #EFEAE2;
    --sheet: #F7F4EE;
    --ink: #1C1915;
    --ink-2: #514C44;
    --ink-3: #5E584E;
    --line: #D9D1C3;
    --fill: #E7E0D4;
    --accent: #17384A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3EEF3;
    --moss: #1B5E3B;
    --moss-soft: #E3F0E7;
    --ochre: #7A4E0D;
    --ochre-soft: #F6EDD8;
    --seal: #8E2F2A;
    --seal-soft: #F6E4E1;
    width: 390px;
    height: 844px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "InvoiceUI", "Noto Sans CJK JP", sans-serif;
  }
  .phone.dark {
    --paper: #141311;
    --sheet: #1E1C19;
    --ink: #F4F0E8;
    --ink-2: #C9C1B4;
    --ink-3: #A39B8E;
    --line: #3C3832;
    --fill: #2A2722;
    --accent: #E4D3BC;
    --accent-ink: #1C1915;
    --accent-soft: #2A3338;
    --moss: #8FCBAA;
    --moss-soft: #1A2E24;
    --ochre: #E2B86A;
    --ochre-soft: #2E2618;
    --seal: #F0B0A8;
    --seal-soft: #3A2422;
  }
  .phone.dark .badge { color: #141311; }

  .status {
    height: 47px;
    flex: none;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 22px 8px 24px;
    font-weight: 700;
    font-size: 15px;
  }
  .sys { display: flex; align-items: center; gap: 6px; }
  .sys svg { display: block; }

  .scroll { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 20px; }
  .nav {
    height: 42px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px 0 12px;
    gap: 8px;
  }
  .back { font-size: 16px; color: var(--accent); font-weight: 700; min-width: 52px; }
  .nav-title { font-size: 16px; font-weight: 700; }
  .hind {
    position: absolute;
    bottom: 8px;
    left: 50%;
    width: 128px;
    height: 5px;
    border-radius: 3px;
    background: var(--ink);
    opacity: 0.28;
    transform: translateX(-50%);
    z-index: 4;
  }

  .htitle { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { font-size: 22px; line-height: 28px; margin: 2px 0 0; font-weight: 700; }
  .screen-name { font-size: 26px; line-height: 32px; margin: 0; font-weight: 700; }
  .ex { font-size: 12px; color: var(--ink-2); font-weight: 400; flex: none; }
  .sub { margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-2); }

  .bchip {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: var(--moss-soft);
    border-left: 3px solid var(--moss);
    border-radius: 10px;
    padding: 10px 10px 10px 12px;
    color: inherit;
    font: inherit;
  }
  .bchip.bad { background: var(--seal-soft); border-left-color: var(--seal); }
  .bchip .bt { display: block; font-size: 16px; line-height: 20px; font-weight: 700; }
  .bchip .bs { display: block; font-size: 13px; line-height: 18px; color: var(--ink-2); margin-top: 1px; }
  .bchip .chev { margin-left: auto; flex: none; color: var(--ink-2); }
  .badge {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; flex: none; color: #fff;
  }
  .badge.moss { background: var(--moss); }
  .badge.seal { background: var(--seal); }
  .badge.ochre { background: var(--ochre); }
  .badge.sm { width: 22px; height: 22px; }
  .badge svg { display: block; }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    height: 48px; border-radius: 10px; font-size: 16px; font-weight: 700;
    font-family: inherit;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
  .actions .btn.primary { flex: 1; width: auto; }
  .btn.secondary {
    background: var(--sheet); color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn.side { width: 84px; flex: none; }
  .btn.block { width: 100%; }
  .btn.quiet { height: 40px; background: transparent; color: var(--accent); }
  .btn.seal { height: 44px; background: transparent; color: var(--seal); }
  .btn.disabled { background: var(--fill); color: var(--ink-3); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .footer {
    flex: none;
    padding: 8px 20px 28px;
    background: var(--paper);
  }
  .footer .btn { width: 100%; flex: none; }
  .footer.ruled { border-top: 1px solid var(--line); }

  .sec { margin: 12px 0 4px; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink-2); }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    min-height: 52px;
  }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-size: 16px; line-height: 21px; font-weight: 700; }
  .row .m { font-size: 13px; line-height: 18px; color: var(--ink-2); margin-top: 1px; }
  .yen { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .between { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }

  .mark {
    width: 32px; height: 32px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    background: var(--sheet);
  }
  .mark.void { color: var(--seal); border-color: var(--seal); }
  .voidword { color: var(--seal); font-weight: 700; font-size: 12px; margin-left: 6px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--sheet);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    line-height: 18px;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }

  .tabsel {
    display: flex;
    margin: 8px -20px 0;
    padding: 0 6px;
    border-bottom: 1px solid var(--line);
  }
  .tabsel span {
    flex: 1;
    text-align: center;
    font-size: 13px;
    line-height: 18px;
    color: var(--ink-2);
    padding: 8px 0 7px;
    border-bottom: 2px solid transparent;
  }
  .tabsel .on { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }

  .tabbar {
    height: 83px; flex: none;
    display: flex;
    padding: 6px 4px 26px;
    border-top: 1px solid var(--line);
    background: var(--sheet);
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--ink-2);
    font-size: 12px;
    line-height: 16px;
    position: relative;
    padding-top: 4px;
  }
  .tab.on { color: var(--accent); font-weight: 700; }
  .tab.on::before {
    content: "";
    position: absolute;
    top: 0;
    width: 16px;
    height: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .tab svg { display: block; }

  .seg {
    display: flex;
    background: var(--fill);
    border-radius: 9px;
    padding: 2px;
    height: 32px;
  }
  .seg span {
    display: flex; align-items: center; justify-content: center;
    padding: 0 12px;
    border-radius: 7px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .seg .on { background: var(--sheet); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }

  .kv { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .kv .k { width: 64px; flex: none; font-size: 12px; color: var(--ink-2); }
  .kv .v { flex: 1; font-size: 16px; line-height: 21px; font-weight: 700; min-width: 0; }
  .kv .link { flex: none; font-size: 13px; font-weight: 700; color: var(--accent); }
  .dates { display: flex; gap: 16px; padding: 8px 0 4px; }
  .dates div { flex: 1; }
  .k { font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .vplain { font-size: 16px; line-height: 21px; margin-top: 1px; }

  .line { padding: 4px 0 5px; border-bottom: 1px solid var(--line); }
  .line .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .line .name { font-size: 15px; line-height: 20px; font-weight: 700; }
  .line .bot { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .tax {
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 6px;
    font-size: 12px;
    line-height: 18px;
    background: var(--sheet);
  }
  .addline { padding: 6px 0; font-size: 13px; font-weight: 700; color: var(--accent); }

  .totals {
    margin-top: 8px;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px 12px 8px;
  }
  .trow { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; line-height: 22px; }
  .trow.sub { color: var(--ink-2); padding-left: 12px; font-size: 13px; line-height: 18px; }
  .trow.grand {
    border-top: 1.5px solid var(--ink);
    margin-top: 4px;
    padding-top: 4px;
    font-size: 20px;
    line-height: 26px;
    font-weight: 700;
  }
  .note { margin: 6px 0 0; font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .memo {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    line-height: 18px;
  }
  .memo .k { display: block; }

  .fld { padding: 6px 0 5px; border-bottom: 1px solid var(--line); }
  .fk { font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .fk em { font-style: normal; color: var(--seal); font-weight: 700; margin-left: 6px; }
  .fv { font-size: 16px; line-height: 21px; margin-top: 1px; }
  .mute { color: var(--ink-3); font-weight: 400; }
  .help { margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-2); }

  .search {
    margin-top: 10px;
    height: 40px;
    border-radius: 10px;
    background: var(--fill);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    color: var(--ink-3);
    font-size: 16px;
  }

  .banner {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--seal-soft);
    border-left: 3px solid var(--seal);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
  }
  .banner.calm { background: var(--accent-soft); border-left-color: var(--accent); }
  .banner p { margin: 0; font-size: 14px; line-height: 20px; }
  .banner strong { display: block; font-size: 16px; line-height: 21px; margin-bottom: 2px; }

  .card {
    margin-top: 10px;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .card h2 { margin: 0; font-size: 16px; line-height: 21px; font-weight: 700; }
  .stat { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .stat:last-child { border-bottom: 0; }
  .stat span:first-child { color: var(--ink-2); }

  .fitline {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 0 8px;
    font-size: 13px; font-weight: 700;
  }
  .a4 {
    width: 350px;
    min-height: 500px;
    margin: 0 auto;
    background: #FFFEFB;
    color: #1C1915;
    box-shadow: 0 10px 28px rgba(28, 25, 21, 0.14);
    padding: 16px 14px 14px;
    font-weight: 400;
  }
  .a4, .a4 * { font-weight: 400; }
  .a4title { text-align: center; font-size: 18px; letter-spacing: 0.2em; line-height: 24px; }
  .a4rule { height: 1px; background: #1C1915; margin: 6px 0 6px; }
  .a4c { text-align: center; font-size: 10px; line-height: 14px; color: #514C44; }
  .parties { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 8px; margin-top: 8px; }
  .client { font-size: 13px; line-height: 17px; }
  .hon { font-size: 12px; line-height: 16px; }
  .issuer { text-align: right; font-size: 9.5px; line-height: 13px; }
  .issuer .nm { font-size: 11px; line-height: 15px; }
  .subj { margin-top: 6px; font-size: 10px; line-height: 14px; }
  .g { display: grid; grid-template-columns: 1.45fr 0.38fr 0.38fr 0.72fr 0.78fr; }
  .g span { font-size: 9.5px; line-height: 13px; padding: 2px 1px; border-bottom: 1px solid #E4DDD2; }
  .g.head span { color: #514C44; border-bottom: 1px solid #1C1915; }
  .g .nmcol { grid-column: 1; }
  .r { text-align: right; }
  .sum { margin-top: 4px; }
  .sum div { display: flex; justify-content: space-between; font-size: 10px; line-height: 14px; }
  .sum .ind { padding-left: 10px; color: #514C44; }
  .sum .gt { border-top: 1px solid #1C1915; margin-top: 2px; padding-top: 2px; font-size: 13px; line-height: 18px; }
  .a4foot { margin-top: 5px; font-size: 9px; line-height: 12px; color: #514C44; }
  .a4foot b { font-weight: 400; color: #1C1915; }

  .scroll.grow { display: flex; flex-direction: column; }
  .ghost {
    margin-top: 4px;
    border: 1.5px dashed var(--seal);
    border-radius: 4px;
    min-height: 420px;
    padding: 28px 20px;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .scroll.grow .ghost { flex: 1; min-height: 0; margin-bottom: 8px; }
  .ghost h2 { margin: 12px 0 0; font-size: 22px; line-height: 28px; }
  .ghost p { margin: 12px 0 0; font-size: 16px; line-height: 24px; }
  .ghost .fact { color: var(--ink-2); font-size: 13px; line-height: 18px; }

  .check {
    display: flex; gap: 10px; align-items: flex-start;
    margin-top: 18px;
    font-size: 16px; line-height: 22px;
  }
  .box {
    width: 24px; height: 24px; flex: none;
    border: 1.5px solid var(--ink);
    border-radius: 5px;
    margin-top: 1px;
  }

  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(28, 25, 21, 0.46);
    display: flex;
    align-items: center;
    padding: 20px;
    z-index: 3;
  }
  .modal {
    width: 100%;
    background: #F7F4EE;
    color: #1C1915;
    border-radius: 14px;
    padding: 18px 16px 12px;
    box-shadow: 0 10px 28px rgba(28, 25, 21, 0.18);
  }
  .modal h2 { margin: 0 0 10px; font-size: 22px; line-height: 28px; font-weight: 700; }
  .modal p { margin: 0 0 10px; font-size: 16px; line-height: 22px; }
  .dim { opacity: 0.55; }

  .gen { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .gen .top { display: flex; justify-content: space-between; font-size: 15px; line-height: 20px; }
  .hash { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sig" viewBox="0 0 17 12">
    <rect x="0" y="7" width="3" height="5" rx="0.4" fill="currentColor"/>
    <rect x="4.6" y="4.5" width="3" height="7.5" rx="0.4" fill="currentColor"/>

    <rect x="13.8" y="0" width="3" height="12" rx="0.4" fill="currentColor"/>
  </symbol>
  <symbol id="wifi" viewBox="0 0 16 12">

    <circle cx="8" cy="10" r="1.1" fill="currentColor"/>
  </symbol>
  <symbol id="bat" viewBox="0 0 25 12">
    <rect x="0.6" y="0.6" width="20.2" height="10.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <rect x="2.2" y="2.2" width="15.2" height="7.6" rx="1" fill="currentColor"/>

    <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/>

    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="home" viewBox="0 0 24 24">
    <path d="M4 11.2 12 5l8 6.2V20a1 1 0 0 1-1 1h-5.2v-5.6H10.2V21H5a1 1 0 0 1-1-1v-8.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
  </symbol>

    <path d="M7 3.6h6.8L18.5 8v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M13.6 3.8V8h4.4M8.5 12.2h7M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>
  <symbol id="people" viewBox="0 0 24 24">
    <circle cx="9" cy="9" r="2.3" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="16" cy="10" r="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M4.5 18.6c.7-2.6 2.6-3.8 4.5-3.8s3.8 1.2 4.5 3.8M14.2 14.6c1.5-.2 3 .5 3.7 2.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>

  <symbol id="gear" viewBox="0 0 24 24">
    <path d="M4 8h16M4 16h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="9" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="15" cy="16" r="2.1" fill="none" stroke="currentColor" stroke-width="1.7"/>

  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/>

</svg>

<div class="wrap">
