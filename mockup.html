<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生成り台帳 · UIモック</title>
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #241f1b;
    color: #E7E0D4;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", "WenQuanYi Micro Hei", sans-serif;
  }
  .page { padding: 36px 32px 80px; }
  .pagehead { max-width: 820px; margin-bottom: 28px; }
  .pagehead p { margin: 0 0 8px; line-height: 1.6; font-size: 14px; }
  .pagehead h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; }
  .pagehead .sub { color: #C4BBAF; }
  .gallery { display: flex; flex-wrap: wrap; gap: 36px 28px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 13px; line-height: 1.45; margin: 0 0 8px; max-width: 390px; color: #E7E0D4; }
  button, input { font-family: inherit; }
  button { cursor: default; }

  .phone {
    --bg: #EFEAE1;
    --elev: #FBF8F3;
    --sunken: #E4DDD0;
    --ink: #1C1915;
    --ink2: #5E574E;
    --ink3: #6A635A;
    --line: #DDD4C6;
    --line2: #C9C0B0;
    --indigo: #1A3F5C;
    --fill: #1A3F5C;
    --press: #122C41;
    --soft: #E3EEF4;
    --on: #F7F4EE;
    --ver: #A33B2B;
    --ver-soft: #F6E6E2;
    --green: #1E5C3A;
    --green-fg: #F7F4EE;
    --green-soft: #E3F0E8;
    --amber: #8A5A10;
    --amber-soft: #F8EED9;
    --red: #8E2F2A;
    --red-soft: #F6E4E2;
    --dis-bg: #DDD4C6;
    --dis-fg: #6A635A;
    --scrim: rgba(28, 25, 21, 0.48);
    width: 390px;
    height: 844px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", "WenQuanYi Micro Hei", sans-serif;
    font-weight: 400;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
  }
  .phone.dark {
    --bg: #141311;
    --elev: #211F1C;
    --sunken: #0E0D0C;
    --ink: #F3EDE4;
    --ink2: #C4BBAF;
    --ink3: #B7AFA3;
    --line: #3A342C;
    --line2: #524A40;
    --indigo: #9FC4D6;
    --fill: #1E4A66;
    --press: #16384E;
    --soft: #1A2C36;
    --on: #F4F0E8;
    --ver: #E7A094;
    --ver-soft: #3A2420;
    --green: #163528;
    --green-fg: #8FCBAA;
    --green-soft: #163528;
    --amber: #E4C07A;
    --amber-soft: #3A2C12;
    --red: #F0A8A2;
    --red-soft: #3A2220;
    --dis-bg: #2A2622;
    --dis-fg: #B7AFA3;
    --scrim: rgba(0, 0, 0, 0.62);
  }
  .phone::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: var(--ink);
    opacity: 0.28;
    z-index: 8;
    pointer-events: none;
  }

  .statusbar {
    height: 47px;
    flex: none;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 22px 7px;
    position: relative;
    font-weight: 700;
    font-size: 15px;
  }
  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    width: 118px;
    height: 32px;
    margin-left: -59px;
    background: #000;
    border-radius: 18px;
  }
  .sys { display: block; }
  .flag {
    height: 18px;
    flex: none;
    background: var(--fill);
    color: var(--on);
    font-size: 10px;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav {
    height: 44px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 12px 0 6px;
  }
  .nav h1 {
    margin: 0;
    font-size: 17px;
    line-height: 22px;
    font-weight: 700;
    flex: 1;
    min-width: 0;
  }
  .iconbtn {
    width: 44px;
    height: 44px;
    border: 0;
    background: transparent;
    color: var(--indigo);
    display: grid;
    place-items: center;
    padding: 0;
    flex: none;
  }
  .content {
    flex: 1;
    min-height: 0;
    padding: 2px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .content.tight { gap: 6px; }
  .footer {
    flex: none;
    background: var(--elev);
    border-top: 1px solid var(--line);
    padding: 8px 16px 26px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tabbar {
    height: 78px;
    flex: none;
    background: var(--elev);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 6px 4px 22px;
  }
  .tab {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--ink2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 11px;
    line-height: 14px;
    font-family: inherit;
    padding: 0;
  }
  .tab.on { color: var(--indigo); font-weight: 700; }
  .tab svg { display: block; }

  .btn {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    border: 0;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
  }
  .btn.primary { background: var(--fill); color: var(--on); }
  .btn.secondary { background: transparent; color: var(--indigo); box-shadow: inset 0 0 0 1.5px var(--indigo); }
  .btn.quiet { height: 36px; background: transparent; color: var(--indigo); font-weight: 400; font-size: 15px; }
  .btn.danger { background: var(--ver-soft); color: var(--ver); }
  .btn.disabled { background: var(--dis-bg); color: var(--dis-fg); font-weight: 700; }
  .actions { display: flex; gap: 8px; }
  .actions .primary { flex: 1; width: auto; }
  .actions .secondary { width: 76px; flex: none; }

  .backup {
    width: 100%;
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid transparent;
    font: inherit;
    color: inherit;
  }
  .backup b { display: block; font-size: 15px; font-weight: 700; }
  .backup small { display: block; margin-top: 2px; color: var(--ink2); font-size: 12px; line-height: 16px; }
  .backup .chev { margin-left: auto; color: var(--ink3); flex: none; }
  .backup.ok { background: var(--green-soft); }
  .backup.bad { background: var(--red-soft); }
  .backup.wait { background: var(--amber-soft); }

  .seal {
    width: 28px;
    height: 28px;
    flex: none;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }
  .seal.sq { border-radius: 6px; }
  .seal.ok { background: var(--green); color: var(--green-fg); }
  .seal.issued { background: var(--fill); color: var(--on); }
  .seal.draft { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); background: transparent; }
  .seal.void { box-shadow: inset 0 0 0 1.5px var(--ver); color: var(--ver); background: transparent; }
  .seal.circle {
    border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px var(--amber);
    color: var(--amber);
    background: transparent;
  }
  .seal.tri { position: relative; color: var(--red); }
  .seal.tri svg { display: block; }
  .seal.tri em {
    position: absolute;
    left: 0; right: 0; top: 8px;
    text-align: center;
    font-style: normal;
    font-size: 11px;
    font-weight: 700;
  }

  .kicker {
    margin: 2px 0 0;
    font-size: 12px;
    line-height: 16px;
    color: var(--ink2);
  }
  .linkcard, .cell {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    background: transparent;
    border: 0;
    color: inherit;
    font: inherit;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .linkcard {
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    min-height: 56px;
  }
  .linkcard b, .cell b { display: block; font-size: 15px; font-weight: 700; }
  .cell b { font-weight: 400; font-size: 16px; }
  .linkcard small, .cell small { display: block; margin-top: 2px; color: var(--ink2); font-size: 12px; line-height: 16px; }
  .linkcard .chev, .cell .chev { margin-left: auto; color: var(--ink3); flex: none; }
  .group { margin-top: 2px; }
  .money { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  .doc {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    column-gap: 10px;
    align-items: center;
    min-height: 60px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .doc .mid b { display: block; font-size: 15px; font-weight: 400; }
  .doc .mid small, .doc .end small { display: block; color: var(--ink2); font-size: 12px; line-height: 16px; margin-top: 2px; }
  .doc .end { text-align: right; }
  .doc .end b { display: block; font-size: 15px; font-weight: 700; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    height: 32px;
    padding: 0 10px;
    border-radius: 8px;
    background: var(--elev);
    box-shadow: inset 0 0 0 1px var(--line2);
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    color: var(--ink);
  }
  .pill.on { box-shadow: inset 0 0 0 1.5px var(--indigo); color: var(--indigo); background: transparent; }

  .seg {
    display: flex;
    background: var(--sunken);
    border-radius: 8px;
    padding: 2px;
    height: 32px;
    flex: none;
  }
  .seg span {
    flex: 1;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: var(--ink2);
    border-radius: 6px;
  }
  .seg span.on {
    background: var(--elev);
    color: var(--ink);
    font-weight: 700;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .seg.mini { width: 148px; flex: none; }
  .seg.mini span { font-size: 13px; }

  .field { display: flex; flex-direction: column; gap: 2px; }
  .lbl { font-size: 12px; line-height: 16px; color: var(--ink2); }
  .input, .area {
    background: var(--elev);
    box-shadow: inset 0 0 0 1px var(--line2);
    border-radius: 8px;
    min-height: 40px;
    padding: 8px 10px;
    font-size: 15px;
    line-height: 22px;
    display: flex;
    align-items: center;
  }
  .input.focus { box-shadow: inset 0 0 0 2px var(--indigo); }
  .area { min-height: 64px; align-items: flex-start; }
  .help { margin: 0; font-size: 12px; line-height: 16px; color: var(--ink2); }
  .err { margin: 0; font-size: 13px; line-height: 18px; color: var(--ver); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .line { padding: 5px 0 6px; border-bottom: 1px solid var(--line); }
  .line .top, .line .bot { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .line .top { font-size: 14px; line-height: 18px; }
  .line .tax { color: var(--ink2); font-size: 12px; flex: none; }
  .line .bot { margin-top: 1px; font-size: 12px; line-height: 16px; color: var(--ink2); }
  .line .bot .money { color: var(--ink); font-weight: 700; font-size: 14px; }

  .totals {
    background: var(--elev);
    border-radius: 8px;
    border-left: 3px solid var(--indigo);
    padding: 8px 10px 8px 12px;
  }
  .trow { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 18px; }
  .trow.sub span:first-child { padding-left: 8px; }
  .trow.grand {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid var(--line);
    font-size: 20px;
    line-height: 26px;
    font-weight: 700;
  }
  .tnote { margin: 4px 0 0; font-size: 11px; line-height: 15px; color: var(--ink2); }

  .banner {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 18px;
  }
  .banner p { margin: 0; }
  .banner.bad { background: var(--ver-soft); color: var(--ink); }
  .banner.info { background: var(--soft); color: var(--ink); border-left: 3px solid var(--indigo); }
  .banner .mark {
    width: 8px;
    flex: none;
  }

  .lede { margin: 0; font-size: 15px; line-height: 22px; }
  .note { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink2); }
  .check {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 15px;
    line-height: 22px;
  }
  .box {
    width: 22px;
    height: 22px;
    flex: none;
    margin-top: 1px;
    border-radius: 4px;
    box-shadow: inset 0 0 0 1.5px var(--line2);
    background: var(--elev);
  }

  .search {
    height: 40px;
    border-radius: 8px;
    background: var(--elev);
    box-shadow: inset 0 0 0 1px var(--line2);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    color: var(--ink3);
    font-size: 15px;
  }
  .search.on { color: var(--ink); box-shadow: inset 0 0 0 2px var(--indigo); }

  .desk {
    flex: 1;
    min-height: 0;
    background: var(--sunken);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 10px 16px 0;
  }
  .a4 {
    width: 340px;
    height: 481px;
    background: #FBF8F3;
    color: #1C1915;
    box-shadow: 0 10px 28px rgba(28, 25, 21, 0.12);
    padding: 14px 12px 10px;
    display: flex;
    flex-direction: column;
  }
  .a4 h2 {
    margin: 0;
    text-align: center;
    font-size: 16px;
    letter-spacing: 0.42em;
    font-weight: 700;
    text-indent: 0.42em;
  }
  .a4 .meta { margin-top: 6px; text-align: right; font-size: 8px; line-height: 1.45; }
  .a4 .who { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 8px; line-height: 1.4; }
  .a4 .who .to { font-size: 12px; font-weight: 700; }
  .a4 .who .from { text-align: right; max-width: 58%; }
  .a4 table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 7.5px; }
  .a4 th { font-weight: 400; color: #1C1915; }
  .a4 th, .a4 td { border-bottom: 0.6px solid #1C1915; padding: 3px 2px; text-align: right; vertical-align: top; }
  .a4 th:first-child, .a4 td.name { text-align: left; }
  .a4 td.name { width: 42%; }
  .a4 .sum { margin-top: 6px; margin-left: auto; width: 62%; font-size: 8px; }
  .a4 .sum div { display: flex; justify-content: space-between; line-height: 1.45; }
  .a4 .sum .grand { font-weight: 700; font-size: 11px; border-top: 0.6px solid #1C1915; margin-top: 2px; padding-top: 2px; }
  .a4 .fine { margin: 4px 0 0; font-size: 7px; line-height: 1.35; }
  .a4 .bank { margin-top: auto; padding-top: 6px; font-size: 8px; line-height: 1.4; border-top: 0.6px solid #1C1915; }
  .paper-cap { padding: 6px 16px 0; font-size: 12px; line-height: 16px; color: var(--ink2); }

  .meter {
    background: var(--elev);
    border-radius: 8px;
    padding: 12px;
  }
  .meter p { margin: 8px 0 0; font-size: 14px; line-height: 20px; }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 4;
    background: var(--scrim);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .sheet {
    background: var(--elev);
    color: var(--ink);
    border-radius: 16px 16px 0 0;
    padding: 8px 16px 28px;
  }
  .grab {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line2);
    margin: 2px auto 10px;
  }
  .sheet h2 { margin: 0 0 8px; font-size: 20px; line-height: 26px; font-weight: 700; }
  .sheet .body { margin: 0 0 8px; font-size: 15px; line-height: 22px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .keys b {
    height: 48px;
    border-radius: 10px;
    background: var(--sunken);
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 700;
  }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .kv span { color: var(--ink2); }
  .kv b { font-weight: 700; text-align: right; max-width: 64%; }
  .hash { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .pick {
    border-radius: 12px;
    background: var(--soft);
    box-shadow: inset 0 0 0 1.5px var(--indigo);
    padding: 10px 12px;
  }
  .pick.dead {
    background: var(--ver-soft);
    box-shadow: inset 0 0 0 1.5px var(--ver);
  }
  .pick b { display: block; font-size: 14px; font-weight: 700; }
  .pick small { display: block; margin-top: 2px; color: var(--ink2); font-size: 12px; line-height: 16px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    line-height: 16px;
    padding: 0 6px;
    border-radius: 4px;
    color: var(--ver);
    box-shadow: inset 0 0 0 1px var(--ver);
    margin-top: 4px;
  }
  .para { margin: 0; font-size: 14px; line-height: 21px; }
  .para + .para { margin-top: 10px; }
  .footquiet { margin: 0; font-size: 12px; line-height: 16px; color: var(--ink2); text-align: center; }
  .split { display: flex; justify-content: space-between; align-items: center; }
  .req { color: var(--ver); font-size: 12px; margin-left: 4px; }
  .phone[data-file="05-editor"] .content.tight { gap: 4px; padding-top: 0; }
  .phone[data-file="05-editor"] .lbl { line-height: 14px; }
  .phone[data-file="05-editor"] .input { min-height: 32px; padding: 4px 10px; font-size: 14px; }
  .phone[data-file="05-editor"] .line { padding: 2px 0 3px; }
  .phone[data-file="05-editor"] .line .top { font-size: 13px; line-height: 16px; }
  .phone[data-file="05-editor"] .pill { height: 26px; font-size: 12px; }
  .phone[data-file="05-editor"] .totals { padding: 6px 8px 6px 10px; }
  .phone[data-file="05-editor"] .trow { font-size: 12px; line-height: 16px; }
  .phone[data-file="05-editor"] .trow.grand { font-size: 18px; line-height: 22px; margin-top: 2px; padding-top: 2px; }
  .phone[data-file="05-editor"] .tnote { margin-top: 2px; line-height: 14px; }
  .phone[data-file="05-editor"] .footer { padding-top: 6px; }
</style>
</head>
<body>
<div class="page">
  <header class="pagehead">
    <p class="sub">オフライン請求・見積 · UIモック · 390×844</p>
    <h1>生成り台帳</h1>
    <p>紙の地は生成り、数字は墨、主操作は藍。各枠の上の帯はモックの注釈で、製品の画面には置かない。氏名、金額、登録番号はすべて例示。</p>
  </header>
  <div class="gallery">

    <figure>
      <figcaption>01 ホーム。24時間以内のバックアップ済</figcaption>
      <div class="phone" data-file="01-home">
        <div class="statusbar"><span>9:41</span><i class="island"></i><svg class="sys" width="54" height="13" viewBox="0 0 54 13" aria-hidden="true"><rect x="0" y="8" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="5" y="5" width="3" height="8" rx="0.5" fill="currentColor"/><rect x="10" y="2.5" width="3" height="10.5" rx="0.5" fill="currentColor"/><rect x="15" y="0" width="3" height="13" rx="0.5" fill="currentColor"/><rect x="30" y="1" width="20" height="11" rx="2" fill="none" stroke="currentColor"/><rect x="32" y="3" width="14" height="7" rx="1" fill="currentColor"/></svg></div>
        <div class="flag">例示データ · 実在の取引ではありません</div>
        <div class="nav"><h1>10月12日（月）</h1></div>
        <div class="content">
          <button class="backup ok">
