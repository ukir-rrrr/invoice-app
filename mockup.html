<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>請求・見積アプリ UIモック</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#E6E8EC;
  color:#1B1E23;
  font-family:"WenQuanYi Micro Hei","Droid Sans Fallback",sans-serif;
  font-weight:400;
}
.wrap{padding:28px 28px 64px}
.intro{max-width:760px;margin:0 0 20px}
.intro h1{font-size:22px;line-height:1.4;margin:0 0 8px;font-weight:700}
.intro p{margin:0 0 6px;font-size:14px;line-height:1.6}
.gallery{display:flex;flex-wrap:wrap;gap:28px 22px;align-items:flex-start}
figure{margin:0}
figcaption{font-size:13px;font-weight:700;margin:0 0 8px}
.phone{
  --paper:#FFFFFF; --sheet:#F4F5F7; --ink:#1B1E23; --ink-2:#3E4651; --ink-3:#4E5764;
  --line:#E1E4E8; --fill:#ECEEF2; --accent:#1A3E6E; --accent-ink:#FFFFFF; --accent-soft:#E7EEF6;
  --moss:#146B3A; --moss-soft:#E5F4EB; --ochre:#7A5208; --ochre-soft:#F8F1DC;
  --seal:#8E2A28; --seal-soft:#FBECEA;
  --pdf-paper:#FFFFFF; --pdf-ink:#1B1E23; --pdf-ink-2:#3E4651; --pdf-line:#E1E4E8;
  --scrim:rgba(16,18,22,.46); --badge-ink:#FFFFFF;
  width:390px; height:844px; position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  background:var(--paper); color:var(--ink);
  font-family:"WenQuanYi Micro Hei","Droid Sans Fallback",sans-serif;
}
.phone.dark{
  --paper:#101418; --sheet:#1B2129; --ink:#F5F7FA; --ink-2:#C6CED8; --ink-3:#A8B2BE;
  --line:#323A44; --fill:#262D36; --accent:#8EBEFF; --accent-ink:#0C1220; --accent-soft:#1A2C44;
  --moss:#8FCBAA; --moss-soft:#15261E; --ochre:#E2B86A; --ochre-soft:#2A2416;
  --seal:#F0B0A8; --seal-soft:#3A2424;
  --scrim:rgba(0,0,0,.62); --badge-ink:#0C1220;
}
.phone.palette-b{
  --paper:#EAF3FB; --sheet:#FFFFFF; --ink:#152033; --ink-2:#3C4C60; --ink-3:#4A5C72;
  --line:#D3E1EE; --fill:#DEEAF4; --accent:#164E8C; --accent-ink:#FFFFFF; --accent-soft:#E3F0FA;
  --scrim:rgba(14,22,34,.46); --badge-ink:#FFFFFF;
}
.phone.dark.palette-b{
  --paper:#0E1622; --sheet:#172232; --ink:#F4F8FC; --ink-2:#C5D3E2; --ink-3:#A9B9CC;
  --line:#2C3C50; --fill:#1E2C3E; --accent:#8EBEFF; --accent-ink:#0B1420; --accent-soft:#1A3048;
  --moss:#8FCBAA; --moss-soft:#13261F; --ochre:#E2B86A; --ochre-soft:#2A2618;
  --seal:#F0B0A8; --seal-soft:#3A2626;
  --scrim:rgba(0,0,0,.62); --badge-ink:#0B1420;
}
.status{height:47px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 8px 24px;font-weight:700;font-size:15px}
.sys{display:flex;align-items:center;gap:6px}
.sys svg{display:block}
.nav{height:44px;flex:none;display:flex;align-items:center;padding:0 12px 0 8px;gap:8px}
.back{min-width:64px;font-size:16px;font-weight:700;color:var(--accent)}
.nav-title{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:0}
.nav-right{min-width:64px;display:flex;justify-content:flex-end}
.nav-right.accent{color:var(--accent);font-weight:700;font-size:16px}
.kind{display:flex;background:var(--fill);border-radius:10px;padding:2px;width:112px}
.kind span{flex:1;text-align:center;font-size:12px;line-height:28px;border-radius:8px;color:var(--ink-2)}
.kind .on{background:var(--sheet);color:var(--ink);font-weight:700}
.scroll{flex:1 1 auto;min-height:0;overflow:hidden;padding:0 20px 8px}
.screen-pad{padding:0 20px}
.screen-name{font-size:26px;line-height:32px;margin:0;font-weight:700}
.title{font-size:22px;line-height:28px;margin:2px 0 8px;font-weight:700}
.date,.sub,.m,.meta{font-size:13px;line-height:18px;color:var(--ink-2);margin:2px 0 0}
.lede{font-size:16px;line-height:24px;margin:16px 0 0}
.lede.tight{margin-top:10px}
.bchip{margin-top:10px;display:flex;align-items:center;gap:10px;background:var(--moss-soft);border-left:3px solid var(--moss);border-radius:10px;padding:8px 10px 8px 12px;min-height:56px}
.bchip.bad{background:var(--seal-soft);border-left-color:var(--seal)}
.btext{flex:1;min-width:0}
.bt{display:block;font-size:16px;line-height:20px;font-weight:700}
.bs{display:block;font-size:13px;line-height:18px;color:var(--ink-2);margin-top:1px}
.chev{margin-left:auto;flex:none;color:var(--ink-2)}
.badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--badge-ink)}
.badge.moss{background:var(--moss)}
.badge.seal{background:var(--seal)}
.badge.sm{width:22px;height:22px}
.badge.sm svg{width:13px;height:13px}
.badge.lg{width:44px;height:44px;margin-bottom:12px}
.badge.lg svg{width:22px;height:22px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;font-size:16px;font-weight:700;font-family:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);width:100%}
.actions .btn.primary{flex:1;width:auto}
.btn.secondary{background:var(--sheet);color:var(--ink);border:1px solid var(--line)}
.btn.side{width:96px;flex:none}
.btn.block{width:100%}
.btn.quiet{height:44px;background:transparent;color:var(--accent)}
.btn.seal{height:44px;background:transparent;color:var(--seal)}
.btn.disabled{background:var(--fill);color:var(--ink-3);width:100%}
.btn.gap{margin-top:8px}
.btn.prev{margin-top:8px;flex-direction:column;height:52px;align-items:flex-start;padding:0 14px}
.pt{font-size:16px;font-weight:700;line-height:20px}
.ps{font-size:13px;line-height:18px;color:var(--ink-2);font-weight:400}
.sec{margin:10px 0 0;font-size:12px;line-height:16px;font-weight:700;color:var(--ink-2)}
.sec.rowish{display:flex;justify-content:space-between;align-items:center}
.quiet{color:var(--accent);font-weight:700;font-size:13px}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:5px 0;border-bottom:1px solid var(--line)}
.main{flex:1;min-width:0}
.t{font-size:16px;line-height:21px;font-weight:700}
.t.small{font-size:13px;line-height:18px;word-break:break-all}
.between{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.yen{font-variant-numeric:tabular-nums;white-space:nowrap}
.mark{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;font-weight:700;font-size:14px;background:var(--sheet)}
.mark.void{color:var(--seal);border-color:var(--seal)}
.voidword{margin-left:6px;color:var(--seal);font-size:12px;font-weight:700}
.end{font-size:13px;color:var(--ink-2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-size:13px;display:inline-flex;align-items:center}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.tabbar{height:83px;flex:none;display:flex;padding:8px 0 28px;border-top:1px solid var(--line);background:var(--paper)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:16px;color:var(--ink-2);position:relative}
.tab.on{color:var(--accent);font-weight:700}
.tab.on::before{content:"";position:absolute;top:-8px;width:16px;height:3px;border-radius:2px;background:var(--accent)}
.hind{position:absolute;bottom:8px;left:50%;width:128px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;transform:translateX(-50%);z-index:6}
.footer{flex:none;padding:8px 20px 28px;background:var(--paper)}
.footer.stack{display:flex;flex-direction:column;gap:8px}
.footer .btn.primary,.footer .btn.disabled,.footer .btn.secondary{width:100%}
.field{margin-top:8px}
.lab{font-size:12px;line-height:16px;color:var(--ink-2)}
.val{font-size:16px;line-height:22px;padding:6px 0 8px;border-bottom:1px solid var(--line)}
.val.ph{color:var(--ink-3)}
.line{padding:7px 0;border-bottom:1px solid var(--line)}
.totals{margin-top:10px;background:var(--sheet);border-radius:14px;padding:10px 12px}
.tr{display:flex;justify-content:space-between;gap:8px;font-size:13px;line-height:20px;padding:1px 0}
.tr.indent{padding-left:12px;color:var(--ink-2)}
.tr.grand{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:22px;line-height:28px;font-weight:700;color:var(--ink)}
.notes{margin-top:8px}
.notes p{margin:0;font-size:12px;line-height:16px;color:var(--ink-2)}
.banner{display:flex;gap:8px;align-items:flex-start;background:var(--seal-soft);border-left:3px solid var(--seal);border-radius:10px;padding:10px 12px;margin-top:4px;font-size:13px;line-height:18px}
.info{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;margin:8px 0 0;font-size:13px;line-height:18px;color:var(--ink)}
.read{padding:8px 0;border-bottom:1px solid var(--line)}
.pair{display:flex;gap:16px;padding:8px 0}
.pair.dates{padding:0;gap:12px}
.pair.dates .field{flex:1;margin-top:6px}
.pair>div{flex:1}
.why{font-size:12px;line-height:16px;color:var(--ink-2);margin:0 0 8px}
.ghost{margin:18px auto 0;width:220px;height:300px;border:1.5px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--ink-3);font-size:13px;letter-spacing:.12em}
.segs{display:flex;height:44px;margin:0 -4px 4px;border-bottom:1px solid var(--line)}
.segs span{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);position:relative}
.segs .on{color:var(--ink);font-weight:700}
.segs .on::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:2px;background:var(--accent)}
.search{height:40px;border-radius:10px;background:var(--fill);display:flex;align-items:center;padding:0 12px;color:var(--ink-3);font-size:16px;margin:4px 0 8px}
.about{margin:4px 0 0;padding:0 0 0 18px}
.about li{font-size:13px;line-height:18px;margin:0 0 6px}
.when{font-size:22px;line-height:28px;margin:12px 0 0;font-weight:700}
.card{margin-top:10px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.bad{opacity:.72}
.card .m{margin-top:6px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);flex:none}
.pill.bad{background:var(--seal-soft);color:var(--seal)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:16px;line-height:22px}
.box{width:24px;height:24px;border:1.5px solid var(--ink-2);border-radius:6px;flex:none;margin-top:1px;background:var(--sheet)}
.repair{display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;padding:20px;z-index:5}
.modal{background:var(--sheet);color:var(--ink);border-radius:14px;padding:20px 18px 16px;width:100%;box-shadow:0 16px 40px rgba(16,18,22,.28)}
.modal h2{margin:0 0 8px;font-size:22px;line-height:28px;font-weight:700}
.modal .body{margin:0 0 8px;font-size:16px;line-height:22px}
.modal .strong{font-weight:700}
.modal .meta{margin:0 0 10px;font-size:13px;line-height:18px;color:var(--ink-2)}
.modal-total{font-size:16px;font-weight:700;margin-bottom:12px}
.fit{margin:4px 0 8px;font-size:13px;line-height:18px;color:var(--ink-2);text-align:center}
.a4{
  width:336px;height:475px;margin:0 auto;background:var(--pdf-paper);color:var(--pdf-ink);
  box-shadow:0 10px 28px rgba(16,18,22,.12);padding:14px 12px 10px;overflow:hidden;
  font-size:10px;line-height:1.35;
}
.phone.dark .a4{box-shadow:0 10px 28px rgba(0,0,0,.45)}
.a4-title{text-align:center;font-size:16px;letter-spacing:.2em;margin:2px 0 6px}
.a4-meta{text-align:right;color:var(--pdf-ink-2);margin-bottom:6px}
.a4-parties{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.a4-parties .right{text-align:right}
.a4 table{width:100%;border-collapse:collapse;margin-top:4px}
.a4 th,.a4 td{border-bottom:1px solid var(--pdf-line);padding:3px 2px;text-align:right;font-weight:400}
.a4 th:first-child,.a4 td:first-child{text-align:left}
.a4 th{color:var(--pdf-ink-2);font-size:9px}
.a4-tot{margin-top:6px}
.a4-tot div{display:flex;justify-content:space-between;padding:1px 0}
.a4-tot .sum{margin-top:3px;padding-top:3px;border-top:1px solid var(--pdf-ink);font-size:13px}
.a4-foot,.a4-bank{margin-top:4px;color:var(--pdf-ink-2)}
.scroll.editor .field:first-child{margin-top:0}
.scroll.editor .field{margin-top:4px}
.scroll.editor .val{padding:1px 0 4px;line-height:20px}
.scroll.editor .line{padding:2px 0}
.scroll.editor .line .t{font-size:15px;line-height:19px}
.scroll.editor .sec{margin-top:6px}
.scroll.editor{padding-bottom:0}
.scroll.editor .chips{margin-top:2px}
.scroll.editor .totals{margin-top:2px;padding:8px 12px 8px}
.scroll.editor .tr{line-height:18px}
.scroll.editor .tr.grand{font-size:20px;line-height:26px;margin-top:4px;padding-top:6px}
.scroll.pdf{padding-top:0}
</style>
</head>
